# Cross-checks the decade summaries against Stathead in Nick's signed-in
# browser. Self-hosted only: Sports Reference blocks datacenter IPs. Reports
# agreement per sample and commits the report; a disagreement fails the job
# so it cannot pass unnoticed, but the report is committed either way.
name: Stat Desk Decades Verify

on:
  workflow_dispatch:
    inputs:
      decades:
        description: "Decade start years to check, space-separated (blank = all)"
        required: false
        default: ""
      samples:
        description: "Checks per decade"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: statdesk-decades-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local:
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        shell: cmd
        run: npm install --no-audit --no-fund
      - name: Verify against Stathead
        shell: cmd
        env:
          SAMPLES: ${{ inputs.samples }}
          STATHEAD_PROFILE: C:\statdesk-chrome
          STATHEAD_HEADLESS: "false"
        run: node statdesk/verify-decades.js --commit ${{ inputs.decades }}
