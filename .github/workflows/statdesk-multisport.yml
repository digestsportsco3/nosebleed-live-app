# Multi-sport pulls on Nick's machine: stats.nba.com stalls datacenter IPs,
# and Stathead needs the signed-in browser. Each task commits its own output.
name: Stat Desk Multi-Sport

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        required: true
        default: nba-all
        options: [nba-all, nba-mj, nba-seasons, stathead-forms, stathead-discover2, sport-facts]
      args:
        description: "Extra arguments (e.g. season range '1946 1960', or sport name for sport-facts)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: statdesk-multisport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local:
    runs-on: self-hosted
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install dependencies
        shell: cmd
        run: npm install --no-audit --no-fund
      - name: NBA all
        if: inputs.task == 'nba-all'
        shell: cmd
        run: node statdesk/nba/pull.js all ${{ inputs.args }} --commit
      - name: NBA MJ
        if: inputs.task == 'nba-mj'
        shell: cmd
        run: node statdesk/nba/pull.js mj --commit
      - name: NBA seasons
        if: inputs.task == 'nba-seasons'
        shell: cmd
        run: node statdesk/nba/pull.js seasons ${{ inputs.args }} --commit
      - name: Stathead forms
        if: inputs.task == 'stathead-forms'
        shell: cmd
        env: { STATHEAD_PROFILE: "C:\\statdesk-chrome", STATHEAD_HEADLESS: "false" }
        run: node statdesk/stathead-forms.js --commit
      - name: Stathead discovery 2
        if: inputs.task == 'stathead-discover2'
        shell: cmd
        env: { STATHEAD_PROFILE: "C:\\statdesk-chrome", STATHEAD_HEADLESS: "false" }
        run: node statdesk/stathead-discover2.js --commit
      - name: Sport facts (Stathead)
        if: inputs.task == 'sport-facts'
        shell: cmd
        env: { STATHEAD_PROFILE: "C:\\statdesk-chrome", STATHEAD_HEADLESS: "false" }
        run: node statdesk/sport-facts.js ${{ inputs.args }} --commit
