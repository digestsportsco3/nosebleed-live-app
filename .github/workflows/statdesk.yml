# Runs Stat Desk on a GitHub runner instead of inside a Claude session.
#
# WHY: a cloud Claude session sits behind a network allowlist that blocks
# statsapi.mlb.com and Stathead, and opening it means finding a settings dialog
# that turned out to be hard to locate. A GitHub runner has plain internet
# access and a real encrypted secret store, so the pipeline runs here and
# commits the brief back to the repo. Any Claude session, on any device, then
# just reads the repo. Nick asks in chat; Claude dispatches this and reports.
#
# ON DEMAND ONLY. There is deliberately no `schedule:` trigger here: this runs
# when a person or Claude asks it to, never on its own. To make it a 7am daily
# job later, add this under `on:` and merge the file to the default branch
# (GitHub only runs cron from the default branch):
#
#   schedule:
#     - cron: "0 11 * * *"   # 07:00 America/New_York during EDT
#
# WHERE IT RUNS. Sports Reference serves datacenter IPs a 403, so Stathead
# cannot be reached from a GitHub-hosted runner. The fix is a self-hosted
# runner on Nick's own machine: residential IP, signed-in Chrome profile, and
# it runs unattended. Set up once, per statdesk/SELF-HOSTED.md. Pick
# runner=github to force the API-only path when that machine is off.
#
# No credentials are needed here. The browser profile holds the session, so
# there is no password in this workflow and none in the process.
name: Stat Desk

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Run date YYYY-MM-DD (blank = today, US Eastern)"
        required: false
        default: ""
      stathead:
        description: "Also run Stathead verification"
        type: boolean
        required: false
        default: true
      runner:
        description: "Where to run: self-hosted (Stathead works) or github (API only)"
        type: choice
        required: false
        default: self-hosted
        options: [self-hosted, github]

permissions:
  contents: write

concurrency:
  group: statdesk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Two jobs, not one with a conditional shell: GitHub evaluates `shell:`
  # before any expression context exists, so it cannot be computed. Exactly one
  # of these runs, chosen by the `runner` input.

  # Nick's own machine. Residential IP that Sports Reference does not block,
  # plus a signed-in Chrome profile, so the Stathead half works unattended.
  # cmd, not PowerShell: that machine has script execution disabled, which
  # blocks the .ps1 the runner writes for a run: block.
  local:
    if: inputs.runner != 'github'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The runner checks out into its own _work folder, not the clone where
      # playwright was installed by hand, so install it here. The downloaded
      # browser itself lives per-user and is already present.
      - name: Install dependencies
        shell: cmd
        run: npm install --no-audit --no-fund

      - name: Run Stat Desk
        shell: cmd
        env:
          RUN_DATE: ${{ inputs.date }}
          WANT_STATHEAD: ${{ inputs.stathead }}
          STATHEAD_PROFILE: C:\statdesk-chrome
          # Visible browser. The same probe passes headed and fails headless,
          # so Sports Reference appears to withhold results from headless
          # Chrome regardless of the session.
          STATHEAD_HEADLESS: "false"
        run: node statdesk/ci.js

  # Fallback for when that machine is off. MLB API and ESPN still work; the
  # Stathead history queries are skipped and the brief says so.
  cloud:
    if: inputs.runner == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Stat Desk
        shell: bash
        env:
          RUN_DATE: ${{ inputs.date }}
          WANT_STATHEAD: "false"
        run: node statdesk/ci.js
