# Runs Stat Desk on a GitHub runner instead of inside a Claude session.
#
# WHY: a cloud Claude session sits behind a network allowlist that blocks
# statsapi.mlb.com and Stathead, and opening it means finding a settings dialog
# that turned out to be hard to locate. A GitHub runner has plain internet
# access and a real encrypted secret store, so the pipeline runs here and
# commits the brief back to the repo. Any Claude session, on any device, then
# just reads the repo. Nick asks in chat; Claude dispatches this and reports.
#
# ON DEMAND ONLY. There is deliberately no `schedule:` trigger here: this runs
# when a person or Claude asks it to, never on its own. To make it a 7am daily
# job later, add this under `on:` and merge the file to the default branch
# (GitHub only runs cron from the default branch):
#
#   schedule:
#     - cron: "0 11 * * *"   # 07:00 America/New_York during EDT
#
# STATHEAD IS OFF BY DEFAULT, ON PURPOSE. Sports Reference blocks datacenter
# IPs: the login page returned 200 from this runner early on and 403 after a
# handful of runs in the same half hour. Retrying from cloud IPs risks the
# subscription for no gain, so the flag defaults to false and must be turned on
# deliberately. Historical verification belongs in a browser signed in as Nick.
# What the API pull gives is already verifiable: league-wide ranks and counts
# computed across the complete 2026 pull are facts, not guesses, and every
# kicker should be written from those.
#
# Secrets it reads (repo Settings > Secrets and variables > Actions):
#   STATHEAD_USER, STATHEAD_PASS
# Without them the MLB half still runs and the Stathead half reports why it
# stopped. Nothing is ever estimated.
name: Stat Desk

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Run date YYYY-MM-DD (blank = today, US Eastern)"
        required: false
        default: ""
      stathead:
        description: "Also run Stathead (OFF by default: runners are IP-blocked, see note)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: statdesk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Stat Desk
        id: run
        env:
          STATHEAD_USER: ${{ secrets.STATHEAD_USER }}
          STATHEAD_PASS: ${{ secrets.STATHEAD_PASS }}
          RUN_DATE: ${{ inputs.date }}
          WANT_STATHEAD: ${{ inputs.stathead }}
        run: |
          set +e
          ARGS=""
          if [ -n "$RUN_DATE" ]; then ARGS="$ARGS --date $RUN_DATE"; fi
          if [ "$WANT_STATHEAD" != "false" ]; then ARGS="$ARGS --stathead"; fi
          echo "running: node statdesk/run.js $ARGS"
          node statdesk/run.js $ARGS 2>&1 | tee /tmp/statdesk.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit whatever the run produced
        env:
          RUN_DATE: ${{ inputs.date }}
        run: |
          git config user.name "statdesk-bot"
          git config user.email "noreply@anthropic.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          D="$RUN_DATE"
          [ -n "$D" ] || D="$(TZ=America/New_York date +%F)"
          git commit -m "Stat Desk $D: run from GitHub Actions"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" \
              && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "Could not push after 3 attempts." >&2
          exit 1

      - name: Report
        if: always()
        env:
          RUN_DATE: ${{ inputs.date }}
        run: |
          D="$RUN_DATE"
          [ -n "$D" ] || D="$(TZ=America/New_York date +%F)"
          {
            echo "## Stat Desk — $D"
            for f in "statdesk/briefs/$D-statdesk.md" "statdesk/briefs/$D-fresh10.md"; do
              if [ -f "$f" ]; then echo; cat "$f"; fi
            done
            if [ "${{ steps.run.outputs.code }}" != "0" ]; then
              echo
              echo "Run exited ${{ steps.run.outputs.code }}. Last lines of the log:"
              echo '```'
              tail -40 /tmp/statdesk.log 2>/dev/null || echo "(no log)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
