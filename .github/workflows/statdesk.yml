# Runs Stat Desk on a GitHub runner instead of inside a Claude session.
#
# WHY: a cloud Claude session sits behind a network allowlist that blocks
# statsapi.mlb.com and Stathead, and opening it means finding a settings dialog
# that turned out to be hard to locate. A GitHub runner has plain internet
# access and a real encrypted secret store, so the pipeline runs here and
# commits the brief back to the repo. Any Claude session, on any device, then
# just reads the repo. Nick asks in chat; Claude dispatches this and reports.
#
# ON DEMAND ONLY. There is deliberately no `schedule:` trigger here: this runs
# when a person or Claude asks it to, never on its own. To make it a 7am daily
# job later, add this under `on:` and merge the file to the default branch
# (GitHub only runs cron from the default branch):
#
#   schedule:
#     - cron: "0 11 * * *"   # 07:00 America/New_York during EDT
#
# WHERE IT RUNS. Sports Reference serves datacenter IPs a 403, so Stathead
# cannot be reached from a GitHub-hosted runner. The fix is a self-hosted
# runner on Nick's own machine: residential IP, signed-in Chrome profile, and
# it runs unattended. Set up once, per statdesk/SELF-HOSTED.md. Pick
# runner=github to force the API-only path when that machine is off.
#
# No credentials are needed here. The browser profile holds the session, so
# there is no password in this workflow and none in the process.
name: Stat Desk

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Run date YYYY-MM-DD (blank = today, US Eastern)"
        required: false
        default: ""
      stathead:
        description: "Also run Stathead verification"
        type: boolean
        required: false
        default: true
      runner:
        description: "Where to run: self-hosted (Stathead works) or github (API only)"
        type: choice
        required: false
        default: self-hosted
        options: [self-hosted, github]

permissions:
  contents: write

concurrency:
  group: statdesk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    # self-hosted is Nick's own machine: a residential IP Sports Reference does
    # not block, with a signed-in Chrome profile. That is what makes the
    # Stathead half work unattended. github runners still do the MLB API half.
    runs-on: ${{ inputs.runner == 'github' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # One Node call, no shell dependency. Windows runners have no bash on
      # PATH and default to PowerShell; Ubuntu defaults to bash. Node is on
      # both, so the whole job lives in statdesk/ci.js.
      - name: Run Stat Desk
        # cmd on Windows, bash on the cloud fallback. NOT PowerShell: this
        # machine has script execution disabled, so the .ps1 the runner writes
        # for a `run:` block is refused before node is ever reached.
        shell: ${{ github.event.inputs.runner == 'github' && 'bash' || 'cmd' }}
        env:
          RUN_DATE: ${{ inputs.date }}
          WANT_STATHEAD: ${{ inputs.stathead }}
          STATHEAD_PROFILE: ${{ inputs.runner == 'github' && '' || 'C:\statdesk-chrome' }}
        run: node statdesk/ci.js
